name: Build KernelSU ZIP

on:
  push:
    branches: [main, dev/ksu-native-fcm]
    paths:
      - 'module/**'
      - 'tests/**'
      - '.github/workflows/build-ksu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ksu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts and FCM lifecycle monitor
        run: |
          for script in module/*.sh module/bin/*.sh; do sh -n "$script"; done
          sh tests/fcm-monitor-smoke.sh
      - name: Validate embedded WebUI JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('module/webroot/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No inline WebUI script found')
          Path('/tmp/berryfcm-webui.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/berryfcm-webui.js
      - name: Package KernelSU module
        id: package
        run: |
          test -f module/module.prop
          mkdir -p dist
          version="$(sed -n 's/^version=//p' module/module.prop)"
          test -n "$version"
          echo "name=BerryFCM-KSU-v$version" >> "$GITHUB_OUTPUT"
          cd module
          zip -qr "../dist/BerryFCM-KSU-v$version.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 30
