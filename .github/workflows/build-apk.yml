name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Compile-only check. This debug APK is deliberately NOT uploaded or distributed:
      # each GitHub runner has a different debug key and it would break update installs.
      - name: Compile APK sources
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare persistent release signing key
        id: signing
        env:
          BERRYFCM_KEYSTORE_BASE64: ${{ secrets.BERRYFCM_KEYSTORE_BASE64 }}
          BERRYFCM_KEYSTORE_PASSWORD: ${{ secrets.BERRYFCM_KEYSTORE_PASSWORD }}
          BERRYFCM_KEY_ALIAS: ${{ secrets.BERRYFCM_KEY_ALIAS }}
          BERRYFCM_KEY_PASSWORD: ${{ secrets.BERRYFCM_KEY_PASSWORD }}
        run: |
          if [ -z "$BERRYFCM_KEYSTORE_BASE64" ] || [ -z "$BERRYFCM_KEYSTORE_PASSWORD" ] || [ -z "$BERRYFCM_KEY_ALIAS" ] || [ -z "$BERRYFCM_KEY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable APK signing secrets are not configured. Compilation passed, but no installable APK was published."
            exit 0
          fi
          printf '%s' "$BERRYFCM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/berryfcm-release.p12"
          test -s "$RUNNER_TEMP/berryfcm-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/berryfcm-release.p12" -storetype PKCS12 -storepass "$BERRYFCM_KEYSTORE_PASSWORD" -alias "$BERRYFCM_KEY_ALIAS" >/dev/null
          # Export the selected certificate to DER, then hash the exact certificate bytes.
          cert_file="$RUNNER_TEMP/berryfcm-certificate.der"
          if ! keytool -exportcert -keystore "$RUNNER_TEMP/berryfcm-release.p12" -storetype PKCS12 -storepass "$BERRYFCM_KEYSTORE_PASSWORD" -alias "$BERRYFCM_KEY_ALIAS" > "$cert_file"; then
            echo "::error::keytool could not export the selected signing certificate."
            exit 1
          fi
          echo "Exported certificate size: $(wc -c < "$cert_file") bytes"
          actual="$(sha256sum "$cert_file" | awk '{print toupper($1)}')"
          echo "Signing certificate SHA-256: $actual"
          echo "Expected certificate SHA-256: BB328497280F72FE6662E84D7D0D0B15BAF425872B9B360287ED120529D97615"
          if [ "$actual" != "BB328497280F72FE6662E84D7D0D0B15BAF425872B9B360287ED120529D97615" ]; then
            echo "::error::Signing certificate fingerprint differs from the approved BerryFCM key."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build stable-signed APK
        if: steps.signing.outputs.available == 'true'
        env:
          BERRYFCM_KEYSTORE_FILE: ${{ runner.temp }}/berryfcm-release.p12
          BERRYFCM_KEYSTORE_PASSWORD: ${{ secrets.BERRYFCM_KEYSTORE_PASSWORD }}
          BERRYFCM_KEY_ALIAS: ${{ secrets.BERRYFCM_KEY_ALIAS }}
          BERRYFCM_KEY_PASSWORD: ${{ secrets.BERRYFCM_KEY_PASSWORD }}
          BERRYFCM_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signature and stage APK
        if: steps.signing.outputs.available == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p dist
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "dist/BerryFCM-Guardian-v0.1.0-alpha.${BUILD_NUMBER}.apk"

      - name: Upload stable-signed APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BerryFCM-Guardian-v0.1.0-alpha.${{ github.run_number }}
          path: dist/BerryFCM-Guardian-v0.1.0-alpha.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Explain missing signing setup
        if: steps.signing.outputs.available != 'true'
        run: |
          {
            echo "### APK source compilation passed"
            echo
            echo "No APK artifact was published because the persistent release-signing GitHub secrets are missing."
            echo "Add the four BERRYFCM signing secrets described in README.md, then rerun this workflow."
            echo "The per-run debug APK was intentionally not uploaded because it cannot be reliably upgraded across runners."
          } >> "$GITHUB_STEP_SUMMARY"
