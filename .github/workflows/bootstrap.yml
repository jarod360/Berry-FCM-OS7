name: Bootstrap source tree

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/source.tar.xz.b64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source archive and commit the project
        run: |
          base64 --decode bootstrap/source.tar.xz.b64 > /tmp/berryfcm-source.tar.xz
          mkdir -p /tmp/berryfcm-source
          xz -dc /tmp/berryfcm-source.tar.xz | tar -xf - -C /tmp/berryfcm-source
          cp -a /tmp/berryfcm-source/. .
          # Workflow files are installed separately with the authorized GitHub API.
          rm -f .github/workflows/build-ksu.yml .github/workflows/build-apk.yml
          rm -f bootstrap/source.tar.xz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Initialize KernelSU and Android source trees"
            git push origin HEAD:main
          fi
