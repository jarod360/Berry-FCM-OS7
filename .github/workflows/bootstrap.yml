name: Bootstrap source tree

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/source.tar.xz.b64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source archive and commit the complete project
        run: |
          base64 --decode bootstrap/source.tar.xz.b64 > /tmp/berryfcm-source.tar.xz
          xz -dc /tmp/berryfcm-source.tar.xz | tar -xf - -C .
          rm -f bootstrap/source.tar.xz.b64 .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initialize KernelSU and Android source trees"
          git push origin HEAD:main
      - name: Dispatch independent cloud builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-ksu.yml --ref main
          gh workflow run build-apk.yml --ref main
