name: Verify recovery and compile (no release)
on:
  push:
    branches: [verify/fcm-recovery]
permissions:
  contents: read
  statuses: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record regression run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context=berryfcm/recovery-regression -f state=pending -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
      - name: Validate actual shell logic and recovery regression
        run: |
          sh -n app/src/main/assets/fcm-monitor.sh
          sh tests/apk-native-fcm-smoke.sh
          sh tests/apk-module-smoke.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Compile complete Android app (no signed APK or release)
        run: gradle --no-daemon :app:assembleDebug
      - name: Record regression result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in success) state=success;; *) state=failure;; esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context=berryfcm/recovery-regression -f state="$state" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
