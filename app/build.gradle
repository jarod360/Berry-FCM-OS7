plugins {
    id 'com.android.application'
}

// Persistent signing identity: keep applicationId and release keystore stable across updates.
def buildNumber = (System.getenv("BERRYFCM_VERSION_CODE") ?: "1").toInteger()

android {
    namespace 'top.zesun.berryfcm'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'top.zesun.berryfcm'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "0.1.0-alpha.${buildNumber}"
    }

    signingConfigs {
        release {
            // A single private PKCS12 keystore is supplied through GitHub Actions secrets.
            // Never commit the keystore or its password to this public repository.
            storeFile file(System.getenv("BERRYFCM_KEYSTORE_FILE") ?: "${rootDir}/missing-release-key.p12")
            storeType "PKCS12"
            storePassword System.getenv("BERRYFCM_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("BERRYFCM_KEY_ALIAS") ?: "berryfcm"
            keyPassword System.getenv("BERRYFCM_KEY_PASSWORD") ?: ""
        }
    }

    // Priv Kit's native starter requires extraction on Android 8–9.
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'io.github.priv-kit:priv-core:0.20.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
